spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET_KEY}
  refresh:
    secret:
      key: ${JWT_REFRESH_SECRET_KEY}

apple:
  signin:
    client:
      id: ${APPLE_SIGNIN_CLIENT_ID}
    team:
      id: ${APPLE_SIGNIN_TEAM_ID}
    key:
      id: ${APPLE_SIGNIN_KEY_ID}
    audience: ${APPLE_SIGNIN_AUDIENCE}
    private:
      key: ${APPLE_SIGNIN_PRIVATE_KEY}
    grant:
      type: ${APPLE_SIGNIN_GRANT_TYPE}
